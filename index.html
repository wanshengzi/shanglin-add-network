<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shanglin 主链一键添加</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    /* Tailwind CSS (CDN) */
    @import url('https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css');

    :root {
      --primary-a: #6C5CE7;
      --primary-b: #00B894;
      --bg-a: #0F172A;
      --bg-b: #1E293B;
      --text-strong: #F8FAFC;
      --text-muted: #94A3B8;
      --ok: #22C55E;
      --err: #EF4444;
      --warn: #F59E0B;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: 'Roboto', system-ui, -apple-system, sans-serif;
      color: var(--text-strong);
      background:
        radial-gradient(900px 600px at 12% -10%, rgba(108,92,231,.28), transparent 60%),
        radial-gradient(800px 600px at 100% 0%, rgba(0,184,148,.18), transparent 55%),
        radial-gradient(700px 500px at 50% 120%, rgba(108,92,231,.16), transparent 60%),
        linear-gradient(160deg, var(--bg-a) 0%, var(--bg-b) 100%);
      background-attachment: fixed;
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
      overflow-x: hidden;
    }

    /* ambient floating orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(70px);
      opacity: .35;
      pointer-events: none;
      animation: float 14s ease-in-out infinite alternate;
      z-index: 0;
    }
    .orb.a { width: 320px; height: 320px; background: var(--primary-a); top: -80px; left: -60px; }
    .orb.b { width: 260px; height: 260px; background: var(--primary-b); bottom: -90px; right: -40px; animation-delay: -6s; }
    @keyframes float {
      from { transform: translate3d(0,0,0) scale(1); }
      to   { transform: translate3d(20px,26px,0) scale(1.12); }
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      background: rgba(30, 41, 59, .58);
      border: 1px solid rgba(148, 163, 184, .18);
      border-radius: 22px;
      padding: 34px 30px 26px;
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      box-shadow: 0 24px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
      animation: rise .7s cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(18px) scale(.98); }
      to   { opacity: 1; transform: none; }
    }

    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
    .logo {
      width: 34px; height: 34px; border-radius: 11px; flex: none;
      background: linear-gradient(135deg, var(--primary-a), var(--primary-b));
      box-shadow: 0 0 22px rgba(108,92,231,.6);
      position: relative;
      animation: pulse 3.2s ease-in-out infinite;
    }
    .logo::after {
      content: ''; position: absolute; inset: 9px;
      border-radius: 4px; border: 2px solid rgba(255,255,255,.85);
      border-right-color: transparent; transform: rotate(45deg);
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 18px rgba(108,92,231,.5); }
      50%     { box-shadow: 0 0 30px rgba(0,184,148,.65); }
    }

    h1 { font-size: 28px; font-weight: 700; line-height: 1.2; margin: 0; letter-spacing: .2px; }
    .subtitle { color: var(--text-muted); font-size: 14px; margin: 8px 0 24px; line-height: 1.6; }

    .params {
      border: 1px solid rgba(148,163,184,.16);
      background: rgba(15, 23, 42, .55);
      border-radius: 14px;
      padding: 6px 16px;
      margin-bottom: 24px;
    }
    .row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 11px 0; border-bottom: 1px solid rgba(148,163,184,.10);
      font-size: 14px;
    }
    .row:last-child { border-bottom: none; }
    .row .k { color: var(--text-muted); flex: none; }
    .row .v {
      color: var(--text-strong); font-weight: 500; text-align: right;
      word-break: break-all; max-width: 68%;
    }
    .badge {
      display: inline-block; font-size: 12px; font-weight: 700;
      color: #0F172A; background: linear-gradient(135deg, #A29BFE, #55E6C1);
      padding: 2px 10px; border-radius: 999px;
    }

    .btn {
      width: 100%; border: none; cursor: pointer; position: relative; overflow: hidden;
      font-family: inherit; font-size: 16px; font-weight: 700; color: #fff;
      padding: 16px 20px; border-radius: 14px;
      background: linear-gradient(135deg, var(--primary-a) 0%, #7d6bf0 45%, var(--primary-b) 100%);
      box-shadow: 0 12px 30px rgba(108,92,231,.35), inset 0 1px 0 rgba(255,255,255,.25);
      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 18px 38px rgba(108,92,231,.5); filter: brightness(1.06); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }
    .btn .shine {
      position: absolute; top: 0; left: -60%; width: 40%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.28), transparent);
      transform: skewX(-20deg); animation: shine 4.2s ease-in-out infinite;
    }
    @keyframes shine { 0%,60% { left: -60%; } 80%,100% { left: 130%; } }

    .status {
      margin-top: 16px; font-size: 14px; line-height: 1.6;
      min-height: 22px; text-align: center; color: var(--text-muted);
      transition: color .2s ease;
    }
    .status.ok   { color: var(--ok); }
    .status.err  { color: var(--err); }
    .status.warn { color: var(--warn); }

    .foot {
      margin-top: 22px; padding-top: 16px; border-top: 1px solid rgba(148,163,184,.12);
      color: var(--text-muted); font-size: 12px; line-height: 1.6; text-align: center;
    }
    .foot .dot { color: var(--primary-b); }

    @media (max-width: 480px) {
      .card { padding: 26px 20px 22px; border-radius: 18px; }
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="orb a"></div>
  <div class="orb b"></div>

  <main class="card">
    <div class="brand">
      <div class="logo" aria-hidden="true"></div>
      <div>
        <h1>Shanglin 主链一键添加</h1>
      </div>
    </div>
    <p class="subtitle">点击下方按钮，MetaMask 会弹出确认框，添加后即可切换到 Shanglin 主链。</p>

    <section class="params" aria-label="网络参数">
      <div class="row"><span class="k">网络名称</span><span class="v">Shanglin</span></div>
      <div class="row"><span class="k">Chain ID</span><span class="v"><span class="badge">7390</span></span></div>
      <div class="row"><span class="k">RPC URL</span><span class="v">https://118.89.22.150</span></div>
      <div class="row"><span class="k">货币符号</span><span class="v">WUZHU</span></div>
      <div class="row"><span class="k">精度</span><span class="v">18</span></div>
    </section>

    <button class="btn" id="addBtn" type="button">
      <span class="shine"></span>
      <span id="btnLabel">添加到 MetaMask</span>
    </button>

    <div class="status" id="status" role="status" aria-live="polite">请确认你的浏览器已安装 MetaMask 插件。</div>

    <div class="foot">
      <span class="dot">●</span> 本页仅添加公开的网络参数（RPC / Chain ID / 符号），<br />不涉及私钥、助记词或任何签名请求。
    </div>
  </main>

  <script>
    (function () {
      var NETWORK = {
        chainId: '0x1cde',
        chainName: 'Shanglin',
        nativeCurrency: { name: 'Wuzhu', symbol: 'WUZHU', decimals: 18 },
        rpcUrls: ['https://118.89.22.150']
      };

      var btn = document.getElementById('addBtn');
      var label = document.getElementById('btnLabel');
      var status = document.getElementById('status');

      // 移动端普通浏览器：引导到 MetaMask 内置浏览器打开本页（跳转不会保留网页调用）
      var isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
      var inDappBrowser = !!(window.ethereum && window.ethereum.isMetaMask);

      function setStatus(msg, cls) {
        status.innerHTML = msg;
        status.className = 'status' + (cls ? ' ' + cls : '');
      }

      function addNetwork() {
        var eth = window.ethereum;
        if (!eth || !eth.isMetaMask) {
          setStatus('未检测到 MetaMask。电脑请安装插件；手机请用 MetaMask 内置浏览器打开本页。', 'warn');
          return;
        }
        btn.disabled = true;
        label.textContent = '等待钱包确认…';
        setStatus('已在 MetaMask 中弹出添加网络确认框，请在钱包里点击「批准」。', '');
        eth.request({ method: 'wallet_addEthereumChain', params: [NETWORK] })
          .then(function () {
            setStatus('已添加 Shanglin，请切换到该网络查看 WUZHU 余额。', 'ok');
            label.textContent = '添加成功 ✓';
          })
          .catch(function (err) {
            var code = err && err.code;
            var msg = err && err.message ? err.message : '未知错误';
            if (code === 4001) {
              setStatus('你拒绝了添加请求。如需添加，请再次点击并在钱包中批准。', 'warn');
            } else {
              setStatus('添加失败（code ' + code + '）：' + msg, 'err');
            }
            label.textContent = '重试添加';
          })
          .then(function () { btn.disabled = false; });
      }

      // 移动普通浏览器且未检测到 MetaMask：主动提供 deeplink 按钮
      if (isMobile && !inDappBrowser) {
        var pageUrl = location.href;
        var deeplink = 'https://metamask.app.link/dapp/' + pageUrl.replace(/^https?:\/\//, '');
        setStatus('手机请点下方按钮，在 MetaMask 内置浏览器中打开本页后再点「添加」。', 'warn');
        var guide = document.createElement('button');
        guide.type = 'button';
        guide.className = 'btn';
        guide.style.marginTop = '12px';
        guide.innerHTML = '<span class="shine"></span><span>在 MetaMask 浏览器中打开</span>';
        guide.addEventListener('click', function () { window.location.href = deeplink; });
        btn.parentNode.insertBefore(guide, btn.nextSibling);
      }

      btn.addEventListener('click', addNetwork);
    })();
  </script>
</body>
</html>
